name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      VITE_SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID: ${{ vars.VITE_SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID || secrets.VITE_SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID }}
      VITE_SHOPIFY_CUSTOMER_ACCOUNT_REDIRECT_URI: 'https://orbisdata00.github.io/crystal-baaz/'
      VITE_SHOPIFY_CUSTOMER_ACCOUNT_LOGOUT_URI: 'https://orbisdata00.github.io/crystal-baaz/'
      VITE_PUBLIC_SITE_URL: 'https://orbisdata00.github.io/crystal-baaz/'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check Customer Account build configuration
        run: |
          test -n "$VITE_SHOPIFY_CUSTOMER_ACCOUNT_CLIENT_ID" || { echo "Missing Customer Account client ID in the github-pages environment."; exit 1; }
          test "$VITE_SHOPIFY_CUSTOMER_ACCOUNT_REDIRECT_URI" = 'https://orbisdata00.github.io/crystal-baaz/' || { echo "Customer Account callback URL must match the Crystal Baaz GitHub Pages project URL."; exit 1; }
          test "$VITE_SHOPIFY_CUSTOMER_ACCOUNT_LOGOUT_URI" = 'https://orbisdata00.github.io/crystal-baaz/' || { echo "Customer Account logout URL must match the Crystal Baaz GitHub Pages project URL."; exit 1; }
      - run: npm run build
        env:
          VITE_PUBLIC_SITE_URL: 'https://orbisdata00.github.io/crystal-baaz/'
          VITE_SHOPIFY_STORE_DOMAIN: ${{ vars.VITE_SHOPIFY_STORE_DOMAIN || 'crystalbaaz.myshopify.com' }}
          VITE_SHOPIFY_STOREFRONT_PUBLIC_TOKEN: ${{ vars.VITE_SHOPIFY_STOREFRONT_PUBLIC_TOKEN || secrets.VITE_SHOPIFY_STOREFRONT_PUBLIC_TOKEN || '281a71c5808bef1d3783448b3e430411' }}
          VITE_SHOPIFY_API_VERSION: ${{ vars.VITE_SHOPIFY_API_VERSION || '2026-10' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production build
        id: deployment
        uses: actions/deploy-pages@v4
