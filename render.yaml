services:
  - type: web
    name: crystal-baaz-razorpay-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run backend:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: STOREFRONT_ORIGIN
        value: https://orbisdata00.github.io
      - key: SHOPIFY_STORE_DOMAIN
        value: crystalbaaz.myshopify.com
      - key: SHOPIFY_STOREFRONT_PUBLIC_TOKEN
        sync: false
      - key: RAZORPAY_MODE
        value: test
      - key: RAZORPAY_TEST_CHECKOUT_ENABLED
        value: "true"
      - key: RAZORPAY_MAGIC_ENABLED
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
