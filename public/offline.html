<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>You're offline · Crystal Baaz</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #151a27; background: #ffffff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 28px; text-align: center; }
      main { width: min(100%, 380px); }
      .gem { width: 72px; height: 72px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 24px; color: #0c831f; background: #e7f5e9; font-size: 36px; }
      h1 { margin: 0 0 12px; font-size: 28px; font-weight: 600; letter-spacing: -.04em; }
      p { margin: 0; color: #6b7280; font-size: 15px; line-height: 1.55; }
      a { display: inline-block; margin-top: 24px; padding: 12px 18px; border-radius: 24px; color: #fff; background: #0c831f; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="gem" aria-hidden="true">✧</div>
      <h1>You're offline</h1>
      <p>Reconnect to browse the Crystal Baaz catalog. Checkout and inventory updates are unavailable offline.</p>
      <a href="./">Try again</a>
    </main>
  </body>
</html>
